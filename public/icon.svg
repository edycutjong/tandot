<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--primary, #06B6D4)"/>
      <stop offset="100%" stop-color="var(--accent, #10B981)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric T + Circular rotation motif for Tandot -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#brand-grad)" stroke-width="48" stroke-dasharray="140 40 140 40 140 120" stroke-linecap="round" />
  <path d="M 160 180 L 352 180 M 256 180 L 256 360" stroke="url(#brand-grad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
