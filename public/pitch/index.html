    <style>
        /* Tandot Design System Tokens */
        :root {
            --cyan-500: #06b6d4;
            --cyan-400: #22d3ee;
            --emerald-500: #10b981;
            --emerald-400: #34d399;
            --amber-500: #f59e0b;
            --red-500: #ef4444;

            --slate-50: #f8fafc;
            --slate-400: #94a3b8;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --slate-950: #020617;

            --bg-primary: var(--slate-950);
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(148, 163, 184, 0.08);
            --border-hover: rgba(148, 163, 184, 0.2);

            --r-main-font: 'Inter', sans-serif;
            --r-heading-font: 'Outfit', sans-serif;
            --r-heading-color: var(--cyan-500);
            --r-link-color: var(--emerald-500);
            --r-link-color-hover: var(--emerald-400);
            --r-selection-background-color: var(--cyan-500);
            --r-heading-text-transform: none;
            --r-background-color: var(--bg-primary);
        }

        body {
            background: radial-gradient(circle at 20% 30%, rgba(6, 182, 212, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1) 0%, transparent 60%),
                var(--bg-primary);
        }

        .reveal .progress span {
            background-color: var(--emerald-500);
        }

        .reveal .controls {
            color: var(--cyan-500);
        }

        .reveal h1,
        .reveal h2,
        .reveal h3 {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .reveal h1 {
            font-size: 3.5em;
            background: linear-gradient(135deg, var(--cyan-400), var(--emerald-500));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 0.5em;
        }

        .reveal table {
            font-size: 0.8em;
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .reveal table th {
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--glass-border);
            color: var(--cyan-500);
        }

        .reveal table td {
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .reveal ul {
            margin-left: 0;
            display: inline-block;
            text-align: center;
            list-style-position: inside;
        }

        .reveal li {
            margin-bottom: 0.8em;
            color: var(--slate-50);
        }

        /* Tandot aesthetic classes */
        .text-cyan {
            color: var(--cyan-500);
        }

        .text-emerald {
            color: var(--emerald-500);
        }

        .text-muted {
            color: var(--slate-400);
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* WOW Factor Classes */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.08);
        }

        .wow-card {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .wow-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(6, 182, 212, 0.2);
            z-index: 10;
        }

        @keyframes shine {
            0% {
                left: -100%;
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                left: 100%;
                opacity: 0;
            }
        }

        .wow-shine {
            position: relative;
            overflow: hidden;
        }

        .wow-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: skewX(-20deg);
            animation: shine 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

## The $40B Trust Problem

<div class="glass-card wow-card" style="padding: 2em; margin-top: 1em; text-align: center; margin-left: auto; margin-right: auto;">

- **Tandas** (rotating savings circles) are a cultural staple in LATAM.
- **1 in 3** tandas fail because the organizer disappears with the funds.
- Zero recourse, zero insurance, zero proof.

<br />
<div class="text-muted">It's not just lost money; it's broken community trust.</div>
</div>
